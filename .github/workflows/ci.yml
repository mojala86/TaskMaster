name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      # Integration tests start real Postgres and Redis with testcontainers (Docker is preinstalled).
      - run: uv run pytest -v

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: taskmaster
          POSTGRES_PASSWORD: taskmaster
          POSTGRES_DB: taskmaster
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskmaster"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      TASKMASTER_DATABASE_URL: postgresql+psycopg://taskmaster:taskmaster@localhost:5432/taskmaster
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      # Fails if the models changed without a migration (or a migration doesn't match them).
      - run: uv run alembic check
      # Every migration must also be reversible.
      - run: uv run alembic downgrade base && uv run alembic upgrade head

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # Known vulnerabilities (PyPI advisory database) in the locked runtime dependencies.
      - run: uv export --frozen --no-dev --no-emit-project -o requirements.txt
      - run: uvx pip-audit --disable-pip -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t taskmaster:ci .
      # Fixable HIGH/CRITICAL vulnerabilities in the image (OS packages and Python libraries).
      - uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: taskmaster:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
