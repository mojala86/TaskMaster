global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    metrics_path: /metrics/
    static_configs:
      - targets: ["api:8000"]

  # Every replica: Docker's DNS returns one A record per container of a scaled service.
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
        refresh_interval: 10s

  - job_name: relay
    dns_sd_configs:
      - names: ["relay"]
        type: A
        port: 9100
        refresh_interval: 10s
