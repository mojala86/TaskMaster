[project]
name = "taskmaster"
version = "0.1.0"
description = "Distributed job processing platform: transactional outbox, Redis Streams, Postgres"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiobotocore>=2.15",
    "alembic>=1.14",
    "fastapi>=0.115",
    "pillow>=11",
    "prometheus-client>=0.21",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
taskmaster = "taskmaster.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "locust>=2.32",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "testcontainers[postgres,redis]>=4.8",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["taskmaster", "tests"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]
"deploy/grafana/build_dashboard.py" = ["E501"]  # PromQL reads better unwrapped

[tool.mypy]
python_version = "3.13"
packages = ["taskmaster"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["testcontainers.*", "aiobotocore.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: needs Docker (testcontainers)"]
